    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://hack4hack-web.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TeamForge" />
    <meta
      property="og:description"
      content="Create a team, set its size, and let others join in one click. Joins are processed atomically, so a team can never go over capacity."

    />
    <meta name="twitter:image" content="https://hack4hack-web.vercel.app/og.png" />
    <script>
      // Apply the saved theme preference (or the OS preference) before
      // first paint, so the page never flashes the wrong colour scheme.
      (function () {
        try {
          var s = localStorage.getItem('tf-theme') || 'system';
          var d =
            s === 'dark' ||
            (s === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <title>TeamForge — Race-Proof Team Formation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
