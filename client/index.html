<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FAFAF8" />
    <meta
      name="description"
      content="TeamForge — hackathon team formation with atomic joins. Set a team capacity and it holds: no over-filled teams, no duplicate seats."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme preference (or the OS preference) before
      // first paint, so the page never flashes the wrong colour scheme.
      (function () {
        try {
          var s = localStorage.getItem('tf-theme') || 'system';
          var d =
            s === 'dark' ||
            (s === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <title>TeamForge — Race-Proof Team Formation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
